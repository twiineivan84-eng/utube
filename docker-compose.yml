# ============================================================================
# TURIHAMWE MANAGEMENT SYSTEM — PRODUCTION DOCKER COMPOSE
# Organization: Nyamuyanja SACCO Ltd, Isingiro District, Uganda
# Services: Central PostgreSQL 16 + Turihamwe Application Server
# ============================================================================

version: '3.8'

services:
  # 1. Central PostgreSQL Database (Isolated from SACCO Core Banking)
  postgres_db:
    image: postgres:16-alpine
    container_name: turihamwe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-turihamwe_db}
      POSTGRES_USER: ${PGUSER:-turihamwe_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-NyamuyanjaSacco_Secure2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      # Expose only if direct DB administration from host is needed
      - "127.0.0.1:5432:5432"
    networks:
      - turihamwe_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-turihamwe_user} -d ${PGDATABASE:-turihamwe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Turihamwe Application Server (Express API + Vite SPA Frontend)
  app_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turihamwe_app
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://turihamwe.nyamuyanjasacco.ug}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://turihamwe.nyamuyanjasacco.ug}
      JWT_SECRET: ${JWT_SECRET:-enterprise_prod_secret_min32chars_nyamuyanja_sacco_2026}
      JWT_EXPIRY: ${JWT_EXPIRY:-12h}
      DATABASE_URL: postgresql://${PGUSER:-turihamwe_user}:${PGPASSWORD:-NyamuyanjaSacco_Secure2026!}@postgres_db:5432/${PGDATABASE:-turihamwe_db}?sslmode=prefer
      SQLITE_DATABASE_PATH: /app/data/turihamwe-local.sqlite
      DATA_STORAGE_DIR: /app/data
      DATA_FILE_NAME: turihamwe_central_db.json
      SMS_ENABLED: ${SMS_ENABLED:-true}
      SMS_ENVIRONMENT: ${SMS_ENVIRONMENT:-PRODUCTION}
      AT_USERNAME: ${AT_USERNAME:-nyamuyanja_sacco}
      AT_API_KEY: ${AT_API_KEY}
      AT_SENDER_ID: ${AT_SENDER_ID:-TURIHAMWE}
      FILE_STORAGE_PATH: /app/data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_STORAGE_DIR: /app/data/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_API_URL: /api/sync
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-30}
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
    networks:
      - turihamwe_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: turihamwe_postgres_data
  app_data:
    name: turihamwe_app_data

networks:
  turihamwe_internal:
    name: turihamwe_internal_network
    driver: bridge
